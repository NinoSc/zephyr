description: Himax HM01B0 via PIO

compatible: "himax,hm01b0"

include: ["raspberrypi,pico-pio-device.yaml"]

properties:
  vsync-gpios:
    type: phandle-array
    required: true
    description: |
      Vertical Sync.

  hsync-gpios:
    type: phandle-array
    required: true
    description: |
      Horizontal Sync.

  pclk-gpios:
    type: phandle-array
    required: true
    description: |
      Clock.

  data-gpios:
    type: phandle-array
    required: true
    description: |
      Data.

  i2c-bus:
    type: phandle
    required: true

  i2c-address:
    type: int
    required: true
  
  dma:
    type: phandle
    required: true


child-binding:
  child-binding:
    include: video-interfaces.yaml